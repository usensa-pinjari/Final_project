<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030816"><title>Smart Car Safety Control</title><style>
:root{--bg:#020713;--p:#09172b;--l:#1b4d7b;--c:#19d9ff;--g:#21e58a;--r:#ff3d52;--o:#ffb13b;--t:#edf7ff;--m:#8ca8c7}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}button{color:inherit;border:0;font:inherit;cursor:pointer}#app,.screen{width:100%;height:100%;position:relative}.screen{display:none}.screen.on{display:block}
/* intro */#intro{background:radial-gradient(circle at 50% 42%,#0b3158,#020713 60%,#000);overflow:hidden}.grid{position:absolute;inset:-30%;background:linear-gradient(#19d9ff12 1px,transparent 1px),linear-gradient(90deg,#19d9ff12 1px,transparent 1px);background-size:38px 38px;transform:perspective(500px) rotateX(60deg) translateY(35%)}.ring{position:absolute;width:min(72vw,520px);aspect-ratio:1;border:2px solid #19d9ff44;border-radius:50%;box-shadow:0 0 60px #19d9ff22}.ring:after{content:"";position:absolute;inset:12%;border:1px dashed #2688ff66;border-radius:50%;animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.car{position:absolute;width:min(76vw,620px);filter:drop-shadow(0 0 25px #19d9ff55);animation:float 2.5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}.introText{position:absolute;bottom:7vh;width:100%;text-align:center}.brand{font-weight:950;letter-spacing:.08em;font-size:clamp(38px,9vw,72px)}.brand i{color:var(--c);font-style:normal}.sub{font-size:10px;letter-spacing:.25em;color:#aac5e3}.bar{width:min(330px,75vw);height:7px;margin:20px auto 10px;background:#11243e;border-radius:20px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#267cff,#19d9ff,#21e58a);box-shadow:0 0 15px #19d9ff}.status{font-size:11px;letter-spacing:.12em;color:var(--m)}.start{margin-top:20px;padding:14px 28px;border-radius:999px;background:linear-gradient(135deg,#11c9ef,#2878ff);box-shadow:0 0 30px #19d9ff55;font-weight:800}.hide{display:none!important}
/* dashboard */#dash{padding:9px;background:radial-gradient(circle at 50% 35%,#0a234022,transparent 50%),linear-gradient(135deg,#020713,#071225)}header{height:45px;display:flex;align-items:center;gap:9px}.menu,.connect{width:43px;height:43px;border-radius:13px;background:#0a1b32;border:1px solid var(--l);display:grid;place-items:center}.logo{font-weight:900;font-size:clamp(18px,4vw,29px);letter-spacing:.07em;flex:1}.logo i{font-style:normal;color:var(--c)}.bt{padding:8px 10px;border:1px solid #146052;background:#08241f;border-radius:12px;color:var(--g);font-size:11px}.main{height:calc(100% - 45px);display:grid;grid-template-rows:auto 1fr 1fr;gap:7px;min-height:0}.statusbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{background:#07172b;border:1px solid #143a61;border-radius:13px;text-align:center;padding:5px;min-width:0}.stat b{display:block;font-size:9px}.stat small{font-size:9px;color:var(--g)}.camera{position:relative;overflow:hidden;border:1px solid #15558a;border-radius:18px;background:radial-gradient(circle,#173e5b,#061022 60%,#02060d);min-height:0}.camera video{display:none;width:100%;height:100%;object-fit:cover}.ph{height:100%;display:grid;place-items:center;font-size:clamp(75px,20vw,150px)}.live{position:absolute;top:8px;left:8px;z-index:2;background:#250b12;border:1px solid #7b1d2b;color:#ff6877;padding:6px 9px;border-radius:20px;font-size:9px;font-weight:800}.camBtns{position:absolute;right:8px;top:8px;z-index:2;display:flex;gap:5px}.camBtns button{width:34px;height:34px;border-radius:10px;background:#0008;border:1px solid #294e72}.modes{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);background:#000a;border:1px solid #19456e;padding:4px;border-radius:20px;display:flex}.modes button{padding:6px 10px;border-radius:20px;background:transparent;font-size:9px;color:var(--m)}.modes .sel{background:#0a634d;color:#fff}.drive{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:7px;align-items:center;min-height:0}.col{display:grid;gap:7px}.ctrl{min-height:0;aspect-ratio:1.2;border-radius:20px;background:linear-gradient(145deg,#0d2441,#061224);border:1px solid #245d91;display:grid;place-items:center;box-shadow:0 6px 20px #0008}.ctrl:active{transform:scale(.96)}.ctrl svg{width:40%;height:40%}.fwd{border-color:#167f61}.back{border-color:#8b2637}.stop{width:min(40vw,160px);aspect-ratio:1;border-radius:50%;margin:auto;background:radial-gradient(circle,#ff6370,#bd1e34 60%,#430a16);border:5px solid #ff6876;box-shadow:0 0 32px #ff3d5255;display:grid;place-items:center}.stop svg{width:34%}.minirow{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mini{aspect-ratio:1;border-radius:16px;background:#07172b;border:1px solid #1b4b76;display:grid;place-items:center;font-size:9px}.mini strong{font-size:21px}.drawer,.modal{position:absolute;inset:0;z-index:20;background:#000b;backdrop-filter:blur(9px);display:none}.drawer.open,.modal.open{display:block}.drawerCard{height:100%;width:min(330px,86vw);padding:15px;background:linear-gradient(#0a1b31,#030914);border-right:1px solid #1b4d7b}.dhead,.mhead{display:flex;align-items:center;gap:9px;margin-bottom:12px}.dhead b,.mhead b{flex:1;font-size:19px}.mi{width:100%;padding:13px;margin:5px 0;text-align:left;border-radius:13px;background:#091b31;border:1px solid #173f66;display:flex;gap:11px;align-items:center}.mi span{font-size:21px}.mi small{display:block;color:var(--m);font-size:10px;margin-top:2px}.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);max-height:90vh;overflow:auto;background:linear-gradient(#0a1b31,#040a15);border:1px solid #1b4f7e;border-radius:20px;padding:15px}.row{padding:11px 0;border-bottom:1px solid #14304e}.row label{display:flex;justify-content:space-between;color:#bcd0e7;font-size:12px;margin-bottom:8px}input,textarea{width:100%;padding:11px;border-radius:11px;border:1px solid #204b72;background:#061022;color:#fff}input[type=range]{padding:0;accent-color:var(--c)}.primary{padding:11px 15px;border-radius:11px;background:linear-gradient(135deg,#11bff1,#287bff);font-weight:800}.backbtn{width:40px;height:40px;border-radius:11px;background:#0b1c32;border:1px solid #1e486e}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.box{padding:11px;border-radius:13px;background:#07162a;border:1px solid #163b61}.box b{display:block;font-size:10px}.box span{color:var(--g);font-size:11px}.toast{position:absolute;bottom:15px;left:50%;transform:translate(-50%,20px);opacity:0;z-index:100;padding:10px 14px;border-radius:30px;background:#0a1d31;border:1px solid #23608f;font-size:11px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(orientation:landscape) and (min-width:650px){#dash{padding:8px 12px}header{height:42px}.main{height:calc(100% - 42px);grid-template-columns:1.05fr 1.55fr .75fr;grid-template-rows:1fr;gap:8px}.statusbar{grid-column:3;grid-row:1;grid-template-columns:1fr 1fr;align-content:start}.camera{grid-column:2;grid-row:1}.drive{grid-column:1;grid-row:1}.stop{width:min(17vw,145px)}.introText{bottom:4vh}}@media(max-height:650px) and (orientation:portrait){.stat{padding:3px}.ctrl{border-radius:15px}.main{gap:5px}}
</style></head><body><div id="app">
<section id="intro" class="screen on"><div class="grid"></div><div class="ring"></div><svg class="car" viewBox="0 0 700 330"><defs><linearGradient id="g"><stop stop-color="#0d2746"/><stop offset=".5" stop-color="#12618d"/><stop offset="1" stop-color="#07101e"/></linearGradient></defs><ellipse cx="350" cy="292" rx="250" ry="18" fill="#19d9ff" opacity=".18"/><rect x="145" y="120" width="410" height="120" rx="38" fill="url(#g)" stroke="#19d9ff" stroke-width="4"/><path d="M210 125Q260 45 350 45Q440 45 490 125Z" fill="#081a31" stroke="#27a8ff" stroke-width="4"/><path d="M235 116Q270 67 338 64V116Z M362 64Q430 67 465 116H362Z" fill="#0c3555"/><circle cx="185" cy="235" r="54" fill="#050a12" stroke="#1b3857" stroke-width="12"/><circle cx="515" cy="235" r="54" fill="#050a12" stroke="#1b3857" stroke-width="12"/><rect x="278" y="145" width="144" height="70" rx="18" fill="#02070e" stroke="#19d9ff" stroke-width="4"/><circle cx="350" cy="180" r="27" fill="#071a2d" stroke="#19d9ff" stroke-width="5"/><circle cx="350" cy="180" r="10" fill="#02050a"/></svg><div class="introText"><div class="brand">SMART <i>CAR</i></div><div class="sub">ACCIDENT PREVENTION • ESP32 • GPS • GSM</div><div class="bar"><i id="prog"></i></div><div class="status" id="introStatus">SAFETY SYSTEM READY</div><button class="start" id="start">START SYSTEM</button></div></section>
<section id="dash" class="screen"><header><button class="menu" id="menu">☰</button><div class="logo">SMART <i>CAR</i></div><div class="bt" id="bt">READY</div><button class="connect" id="connect">⌁</button></header><main class="main"><div class="statusbar"><div class="stat">📷<b>CAMERA</b><small id="camS">READY</small></div><div class="stat">📍<b>GPS</b><small id="gpsS">READY</small></div><div class="stat">📶<b>GSM</b><small id="gsmS">READY</small></div><div class="stat">✉️<b>SMS</b><small id="smsS">READY</small></div></div><div class="camera"><div class="live">● LIVE • DRIVER MONITOR</div><div class="camBtns"><button id="cam">📷</button><button id="full">⛶</button></div><video id="video" autoplay muted playsinline></video><div class="ph" id="ph">😴</div><div class="modes"><button class="sel" data-mode="ECO">🌿 ECO</button><button data-mode="SPORT">⚡ SPORT</button></div></div><div class="drive"><div class="col"><button class="ctrl" data-cmd="LEFT"><svg viewBox="0 0 100 100"><path d="M76 50H25M25 50l22-22M25 50l22 22" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="ctrl fwd" data-cmd="FORWARD"><svg viewBox="0 0 100 100"><path d="M50 78V24M50 24L28 47M50 24l22 23" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="ctrl back" data-cmd="BACK"><svg viewBox="0 0 100 100"><path d="M50 22v54M50 76L28 53M50 76l22-23" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><button class="stop" id="stop"><svg viewBox="0 0 100 100"><rect x="25" y="25" width="50" height="50" rx="5" fill="white"/></svg></button><div class="col"><button class="ctrl" data-cmd="RIGHT"><svg viewBox="0 0 100 100"><path d="M24 50h51M75 50L53 28M75 50L53 72" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="minirow"><button class="mini" id="horn"><strong>📢</strong>HORN</button><button class="mini" id="light"><strong>💡</strong>LIGHT</button></div></div></div></main><div class="drawer" id="drawer"><div class="drawerCard"><div class="dhead"><b>Control Center</b><button class="menu" id="close">×</button></div><button class="mi" data-open="message"><span>✉️</span><div><b>Send Message</b><small>Family / emergency SMS</small></div></button><button class="mi" data-open="safety"><span>🎯</span><div><b>Stop Sensitivity</b><small>Drowsiness + stop timing</small></div></button><button class="mi" data-open="timing"><span>⏱️</span><div><b>Message Timing</b><small>Alert delay</small></div></button><button class="mi" data-open="live"><span>📊</span><div><b>Live Information</b><small>GPS / GSM / camera</small></div></button><button class="mi" data-open="mode"><span>🏁</span><div><b>Drive Mode</b><small>Sport / Eco</small></div></button></div></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div></section></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let tx=null,dev=null;const S={sens:70,stop:2,msg:3,phone:'+91'};
function tone(f=700,d=.1){try{window.ac||=new AudioContext;let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.value=.04;o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch{}}
function toast(x){let t=$('#toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);tt=setTimeout(()=>t.classList.remove('show'),1700)}
$('#start').onclick=()=>{tone(600,.12);let i=0,steps=['INITIALIZING SAFETY CORE','CHECKING DRIVER MONITOR','CHECKING ESP32 LINK','CHECKING GPS / GSM','SYSTEM READY'];$('#start').classList.add('hide');let z=setInterval(()=>{i++;$('#prog').style.width=i*20+'%';$('#introStatus').textContent=steps[i-1];tone(450+i*80,.06);if(i===5){clearInterval(z);setTimeout(()=>{$('#intro').classList.remove('on');$('#dash').classList.add('on');toast('Safety dashboard ready')},450)}},360)};
$('#cam').onclick=async()=>{try{let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});$('#video').srcObject=s;$('#video').style.display='block';$('#ph').style.display='none';$('#camS').textContent='LIVE';toast('Camera connected')}catch{toast('Camera permission required')}};$('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('.camera').requestFullscreen?.();
const SERVICE='6E400001-B5A3-F393-E0A9-E50E24DCCA9E',RX='6E400002-B5A3-F393-E0A9-E50E24DCCA9E',TX='6E400003-B5A3-F393-E0A9-E50E';
$('#connect').onclick=async()=>{if(!navigator.bluetooth)return toast('Web Bluetooth not supported');try{dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'SMART CAR'},{namePrefix:'ESP32'}],optionalServices:[SERVICE]});let sv=await (await dev.gatt.connect()).getPrimaryService(SERVICE);tx=await sv.getCharacteristic(RX);let n=await sv.getCharacteristic(TX).catch(()=>null);if(n){await n.startNotifications();n.addEventListener('characteristicvaluechanged',e=>telemetry(new TextDecoder().decode(e.target.value)))}$('#bt').textContent='CONNECTED';toast('ESP32 connected');tone(900,.15)}catch{toast('Bluetooth connection cancelled')}};
async function cmd(c){tone(c==='STOP'?250:680,.08);if(tx)try{await tx.writeValue(new TextEncoder().encode(c))}catch{toast('Command failed')}else toast(c==='STOP'?'🛑 STOP command sent':'DEMO: '+c)}
$$('[data-cmd]').forEach(b=>{let c=b.dataset.cmd;b.onpointerdown=e=>{e.preventDefault();cmd(c)};b.onpointerup=()=>cmd('STOP');b.onpointerleave=()=>cmd('STOP')});$('#stop').onclick=()=>cmd('STOP');$('#horn').onclick=()=>cmd('HORN');$('#light').onclick=()=>cmd('LIGHT');
$$('[data-mode]').forEach(b=>b.onclick=()=>{cmd(b.dataset.mode);$$('[data-mode]').forEach(x=>x.classList.toggle('sel',x===b));toast(b.dataset.mode==='ECO'?'🌿 ECO MODE':'⚡ SPORT MODE')});
$('#menu').onclick=()=>$('#drawer').classList.add('open');$('#close').onclick=()=>$('#drawer').classList.remove('open');$('#drawer').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')};
function panel(k){let title={message:'Send Message',safety:'Stop Sensitivity',timing:'Message Timing',live:'Live Information',mode:'Drive Mode'}[k],body='';if(k==='message')body=`<div class="row"><label>Family number</label><input id="phone" value="${S.phone}"></div><div class="row"><label>Message</label><textarea id="msg" rows="4">SMART CAR ALERT: Drowsiness detected. Vehicle stopped for safety. Location will be included.</textarea></div><button class="primary" id="send">SEND MESSAGE</button>`;if(k==='safety')body=`<div class="row"><label>Drowsiness sensitivity <b id="sv">${S.sens}%</b></label><input id="sens" type="range" min="20" max="100" value="${S.sens}"></div><div class="row"><label>Car stop delay <b id="sd">${S.stop.toFixed(1)} sec</b></label><input id="sdx" type="range" min=".2" max="5" step=".1" value="${S.stop}"></div><button class="primary" id="saveS">SAVE SAFETY</button>`;if(k==='timing')body=`<div class="row"><label>SMS delay <b id="md">${S.msg} sec</b></label><input id="mdx" type="range" min="0" max="30" value="${S.msg}"></div><button class="primary" id="saveM">SAVE TIMING</button>`;if(k==='live')body=`<div class="grid2"><div class="box">📷 CAMERA<b>Status</b><span>${$('#camS').textContent}</span></div><div class="box">📍 GPS<b>Status</b><span id="gpsBox">READY</span></div><div class="box">📶 GSM<b>Status</b><span>READY</span></div><div class="box">✉️ SMS<b>Status</b><span id="smsBox">READY</span></div></div><div class="row"><button class="primary" id="gps">GET PHONE GPS</button></div>`;if(k==='mode')body=`<button class="mi" id="eco">🌿 Eco Mode</button><button class="mi" id="sport">⚡ Sport Mode</button>`;$('#sheet').innerHTML=`<div class="mhead"><button class="backbtn" id="back">‹</button><b>${title}</b></div>${body}`;$('#modal').classList.add('open');$('#back').onclick=()=>$('#modal').classList.remove('open');
if(k==='message')$('#send').onclick=()=>{S.phone=$('#phone').value;cmd('SMS|'+S.phone+'|'+$('#msg').value);$('#smsS').textContent='SENT';toast('SMS command sent to GSM')};if(k==='safety'){sens.oninput=()=>sv.textContent=sens.value+'%';sdx.oninput=()=>sd.textContent=(+sdx.value).toFixed(1)+' sec';saveS.onclick=()=>{S.sens=+sens.value;S.stop=+sdx.value;toast('Safety settings saved');$('#modal').classList.remove('open')}}if(k==='timing'){mdx.oninput=()=>md.textContent=mdx.value+' sec';saveM.onclick=()=>{S.msg=+mdx.value;toast('Message timing saved');$('#modal').classList.remove('open')}}if(k==='live')$('#gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{let v=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);gpsBox.textContent=v;$('#gpsS').textContent='LIVE';toast('GPS location received')},()=>toast('Location permission required'));if(k==='mode'){eco.onclick=()=>{cmd('ECO');toast('🌿 ECO MODE');$('#modal').classList.remove('open')};sport.onclick=()=>{cmd('SPORT');toast('⚡ SPORT MODE');$('#modal').classList.remove('open')}}}
$$('[data-open]').forEach(b=>b.onclick=()=>{$('#drawer').classList.remove('open');panel(b.dataset.open)});$('#modal').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')};function telemetry(x){if(x.includes('GPS'))$('#gpsS').textContent='LIVE';if(x.includes('GSM'))$('#gsmS').textContent='ONLINE';if(x.includes('SMS'))$('#smsS').textContent='SENT';if(x.includes('DROWSY')){cmd('STOP');toast('🛡️ DROWSINESS — CAR STOPPED');tone(1000,.15)}}
addEventListener('keydown',e=>{let m={ArrowUp:'FORWARD',ArrowDown:'BACK',ArrowLeft:'LEFT',ArrowRight:'RIGHT',' ':'STOP'}[e.key];if(m){e.preventDefault();cmd(m)}});
</script></body></html>
